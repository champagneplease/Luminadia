services:
  postgres:
    image: postgres:16-alpine
    container_name: luminadia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: luminadia_user
      POSTGRES_PASSWORD: luminadia_secure_password
      POSTGRES_DB: luminadia_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luminadia_user -d luminadia_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
